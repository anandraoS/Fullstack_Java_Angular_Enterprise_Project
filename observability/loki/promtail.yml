# Promtail: tails Docker container stdout (JSON logs from the json-logs profile) and ships to Loki.
server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: oms-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=oms"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # App logs are single-line JSON (logstash-logback-encoder). Non-JSON lines (infra containers) pass through.
      - match:
          selector: '{service=~".+-service|api-gateway"}'
          stages:
            - json:
                expressions:
                  level: level
                  correlationId: correlationId
                  traceId: traceId
                  logger: logger
            - labels:
                level:          # low-cardinality only. correlationId/traceId stay in the line (structured search via LogQL | json)
