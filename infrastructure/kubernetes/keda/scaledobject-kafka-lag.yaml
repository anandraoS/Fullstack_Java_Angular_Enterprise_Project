# EXAMPLE (not part of any overlay): scale on Kafka consumer lag with KEDA instead of CPU.
# Requires KEDA installed. Do NOT keep the plain HPA from base on the same Deployment: KEDA creates its own HPA.
# Remove the base HPA for these targets (patch with $patch: delete) before applying.
# maxReplicaCount must not exceed the topic partition count (3): extra consumers would sit idle.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: inventory-service-lag
spec:
  scaleTargetRef:
    name: inventory-service
  minReplicaCount: 2
  maxReplicaCount: 3
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092           # prod: the MSK bootstrap string (use authenticationRef for SASL/TLS)
        consumerGroup: inventory-service       # consumer group id = service name (contract section 7)
        topic: oms.inventory.commands.v1
        lagThreshold: "50"
        activationLagThreshold: "5"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service-lag
spec:
  scaleTargetRef:
    name: notification-service
  minReplicaCount: 2
  maxReplicaCount: 3
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: notification-service
        topic: oms.order.events.v1
        lagThreshold: "100"
