# EXAMPLE ONLY: External Secrets Operator syncs `oms-secrets` from AWS Secrets Manager. No values are stored here;
# only the remote key NAMES. Requires ESO + a (Cluster)SecretStore named `aws-secrets-manager` using IRSA (no static keys).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oms-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: oms-secrets
    creationPolicy: Owner
  data:
    - { secretKey: jwt-secret, remoteRef: { key: oms/prod/jwt, property: secret } }
    - { secretKey: order-db-username, remoteRef: { key: oms/prod/order-db, property: username } }
    - { secretKey: order-db-password, remoteRef: { key: oms/prod/order-db, property: password } }
    - { secretKey: inventory-db-username, remoteRef: { key: oms/prod/inventory-db, property: username } }
    - { secretKey: inventory-db-password, remoteRef: { key: oms/prod/inventory-db, property: password } }
    - { secretKey: fulfillment-db-username, remoteRef: { key: oms/prod/fulfillment-db, property: username } }
    - { secretKey: fulfillment-db-password, remoteRef: { key: oms/prod/fulfillment-db, property: password } }
    - { secretKey: notification-db-username, remoteRef: { key: oms/prod/notification-db, property: username } }
    - { secretKey: notification-db-password, remoteRef: { key: oms/prod/notification-db, property: password } }
    - { secretKey: redis-password, remoteRef: { key: oms/prod/redis, property: password } }
# Alternative: Bitnami Sealed Secrets. `kubeseal` encrypts a Secret with the cluster's PUBLIC key into a SealedSecret
# that is safe to commit; only the controller in the cluster can decrypt it. Never commit the plain Secret or the private key.
