# Non-secret configuration, injected as environment variables (envFrom). Keys must be valid env var names.
# Overlays patch the values. Property-name mapping (relaxed binding) is an assumption documented in infrastructure/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oms-config
  labels:
    app.kubernetes.io/part-of: oms
data:
  # SECURE DEFAULT: no environment profile here. Every overlay MUST set its own (dev/test: "dev,json-logs"; prod: "prod,json-logs").
  # "dev" enables the token endpoint, seed data and swagger, so it must never be the base default.
  SPRING_PROFILES_ACTIVE: "json-logs"
  OMS_DB_HOST: "postgres"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  OMS_REDIS_ENABLED: "true"
  SPRING_DATA_REDIS_HOST: "redis"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://otel-collector.observability.svc:4318/v1/traces"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "25s"
  OMS_INVENTORY_BASE_URL: "http://inventory-service:18082"
  OMS_GATEWAY_ROUTES_ORDER_URI: "http://order-service:18081"
  OMS_GATEWAY_ROUTES_INVENTORY_URI: "http://inventory-service:18082"
  OMS_GATEWAY_ROUTES_FULFILLMENT_URI: "http://fulfillment-service:18083"
  OMS_GATEWAY_ROUTES_NOTIFICATION_URI: "http://notification-service:18084"
  OMS_GATEWAY_CORS_ALLOWED_ORIGINS: "https://oms.example.test"
