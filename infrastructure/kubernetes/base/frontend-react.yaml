# OPTIONAL second UI (React + Redux Toolkit, ADR 0013): same unprivileged nginx contract as frontend.yaml (port 8080, uid 101).
# It is NOT routed by the Ingress (the Angular UI owns "/"); reach it with
#   kubectl -n oms-dev port-forward svc/oms-ui-react 4201:8080
# or add your own Ingress host. Removing this file from kustomization.yaml removes the React UI completely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-ui-react
  labels:
    app.kubernetes.io/name: oms-ui-react
    app.kubernetes.io/part-of: oms
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oms-ui-react
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oms-ui-react
        app.kubernetes.io/part-of: oms
        app.kubernetes.io/component: ui
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/example-org/oms/oms-ui-react:1.0.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: oms-ui-react
  labels:
    app.kubernetes.io/name: oms-ui-react
    app.kubernetes.io/part-of: oms
spec:
  selector:
    app.kubernetes.io/name: oms-ui-react
  ports:
    - { name: http, port: 8080, targetPort: http }
