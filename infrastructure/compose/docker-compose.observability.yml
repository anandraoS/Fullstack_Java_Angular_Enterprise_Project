# Observability overlay: Prometheus, Grafana (provisioned), OTel Collector, Tempo (traces), Loki + Promtail (logs).
# NOT EXECUTED during authoring (no Docker). Usage:
#   docker compose --env-file .env -f infrastructure/compose/docker-compose.yml \
#                  -f infrastructure/compose/docker-compose.observability.yml up --build
# Grafana http://localhost:3000 (user admin / password GRAFANA_ADMIN_PASSWORD), Prometheus http://localhost:9090
name: oms

x-trace-env: &trace-env
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING:-1.0}

services:
  order-service:
    environment: *trace-env
  inventory-service:
    environment: *trace-env
  fulfillment-service:
    environment: *trace-env
  notification-service:
    environment: *trace-env
  api-gateway:
    environment: *trace-env

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ../../observability/prometheus/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "0.5", memory: 512M } } }

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on: [prometheus, loki, tempo]
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../../observability/otel/otel-collector.yml:/etc/otelcol/config.yaml:ro
    depends_on: [tempo]
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo
    networks: [backend]
    deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } }

  loki:
    image: grafana/loki:3.3.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    networks: [backend]
    deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } }

  promtail:
    image: grafana/promtail:3.3.0
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ../../observability/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      # SECURITY TRADEOFF: docker_sd needs the Docker socket (read-only mount still allows API reads of all
      # container metadata). Acceptable for a laptop demo only. Safer alternatives: Loki Docker logging driver
      # plugin, or in Kubernetes promtail/otel filelog reading /var/log/pods with a restricted ServiceAccount.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "0.25", memory: 128M } } }

volumes:
  promdata:
  grafanadata:
  tempodata:
  lokidata:
