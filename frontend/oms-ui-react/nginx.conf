# Template processed by the nginx image entrypoint (envsubst) into /etc/nginx/conf.d/default.conf.
# (React copy of frontend/oms-ui/nginx.conf.) Only ${API_GATEWAY_URL} and ${OMS_API_BASE_URL} are substituted (NGINX_ENVSUBST_FILTER in the Dockerfile), so nginx
# variables such as $uri are left alone.
#
# nginx drops inherited add_header directives as soon as a location defines its own, so locations below use `expires`
# (which does not interfere) and repeat the one header they need where they must add their own.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # --- security headers ------------------------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Scripts strictly 'self' (the production build emits no inline scripts). 'unsafe-inline' for styles only because
    # MUI/Emotion injects <style> elements at runtime. Fonts are system fonts, so nothing external is needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 128k;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- runtime configuration for the SPA (replaces any static config.json) ---------------------------------------
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"apiBaseUrl":"${OMS_API_BASE_URL}","pollIntervalMs":1500,"pollMaxIntervalMs":8000}';
    }

    # --- API gateway reverse proxy (browser only talks to this origin, so the gateway needs no CORS for the UI) -----
    location /api/ {
        proxy_pass ${API_GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) so a client cannot spoof its address through the proxy chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Authorization, Idempotency-Key and X-Correlation-Id are forwarded untouched.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Content-Type-Options;
    }

    # --- static assets: fingerprinted files are immutable ----------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ico|png|svg|jpg|jpeg|gif|webp|map)$ {
        expires 1y;
        try_files $uri =404;
    }

    # --- SPA fallback: index.html is never cached so a new deployment is picked up immediately ---------------------
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
