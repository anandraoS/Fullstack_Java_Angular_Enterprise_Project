spring:
  datasource:
    # one private in-memory H2 (PostgreSQL mode) per Spring context
    url: jdbc:h2:mem:notif-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  kafka:
    bootstrap-servers: localhost:1   # unreachable on purpose; Kafka tests override via @EmbeddedKafka

server:
  port: 0

oms:
  security:
    jwt:
      allow-ephemeral-secret: true   # tests that need tokens override oms.security.jwt.secret via JwtTestTokens
  messaging:
    admin-timeout-ms: 500
    retry:
      initial-interval-ms: 20
      max-interval-ms: 100
  notification:
    max-attempts: 5
    simulated-failures: 2
    backoff-initial-ms: 10
    backoff-multiplier: 2.0
    backoff-max-ms: 80
    poll-interval-ms: 20
    scheduler-enabled: false

logging:
  level:
    org.apache.kafka: WARN
    kafka: WARN
    org.springframework.kafka: WARN
    org.apache.zookeeper: WARN
    org.hibernate: WARN
