spring:
  application:
    name: test-service
  datasource:
    # in-memory H2 in PostgreSQL mode, same Flyway SQL as production (no credentials of value)
    url: jdbc:h2:mem:platformcommon;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  kafka:
    bootstrap-servers: localhost:1   # unreachable on purpose; Kafka tests override via @EmbeddedKafka

server:
  port: 0

oms:
  security:
    jwt:
      # test-only: random in-memory secret generated at runtime (never a literal secret)
      allow-ephemeral-secret: true
  outbox:
    relay-enabled: false
  messaging:
    admin-timeout-ms: 500
    topics: oms.inventory.events.v1
    retry:
      initial-interval-ms: 20
      max-interval-ms: 100

logging:
  level:
    org.apache.kafka: WARN
    kafka: WARN
    org.springframework.kafka: WARN
    org.apache.zookeeper: WARN
    org.hibernate: WARN
