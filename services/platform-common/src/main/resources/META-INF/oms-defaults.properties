# Platform defaults contributed by platform-common (lowest precedence; override in the service's application.yml).

# --- database: shared common migrations (V1..V8) + service migrations (V10+) ---
spring.flyway.locations=classpath:db/common,classpath:db/migration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- web hardening ---
spring.servlet.multipart.enabled=false
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB

# --- kafka (embedded KRaft from local-stack by default) ---
spring.kafka.bootstrap-servers=${OMS_KAFKA_BOOTSTRAP:localhost:19092}
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# --- actuator / metrics ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.service=${spring.application.name:unknown}
# latency histograms: p95/p99 panels and the OmsHighP95Latency alert use histogram_quantile over *_bucket series. Before this default
# only order- and inventory-service published buckets, so fulfillment/notification had no latency data (check-metric-names.mjs).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.spring.kafka.listener=true

# --- tracing: OFF by default; enable with OMS_TRACING_ENABLED=true (OTLP endpoint + sampling below) ---
management.tracing.enabled=${OMS_TRACING_ENABLED:false}
management.tracing.sampling.probability=${OMS_TRACING_SAMPLING:0.1}
management.otlp.tracing.endpoint=${OMS_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# --- logging: correlation id in the plain console pattern ---
logging.pattern.correlation=[${spring.application.name:},%X{correlationId:-},%X{traceId:-}]

# --- scheduling (outbox relay + cleanup + service jobs) ---
spring.task.scheduling.pool.size=4
